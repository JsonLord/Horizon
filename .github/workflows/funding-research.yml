name: Funding document research and enhancement
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: funding-document-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      propose: ${{ steps.policy.outputs.propose }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - id: policy
        run: |
          python - <<'PY'
          import json,os
          p=json.load(open('config/funding-research.json'))
          if os.environ['GITHUB_EVENT_NAME']=='schedule' and not p['schedule_enabled']:raise SystemExit('Schedule is not authorized')
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('propose='+str(p['review_pr_enabled']).lower()+'\n')
          PY
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Refresh approved funding sources and discover nominations from reviewed queries
        run: uv run python -m scripts.funding_research run
      - uses: actions/upload-artifact@v6
        with:
          name: funding-update
          path: |
            data/funding-update/proposal.json
            data/funding-update/SUMMARY.md
          if-no-files-found: error
          retention-days: 14
  propose:
    needs: collect
    if: needs.collect.outputs.propose == 'true' && github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/funding-research.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - uses: actions/download-artifact@v7
        with:
          name: funding-update
          path: data/funding-update
      - name: Validate and re-render a data-only draft PR with the automatic job token
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python -m scripts.funding_research propose
