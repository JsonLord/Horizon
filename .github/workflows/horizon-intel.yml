name: SystemOne native read-only qualification
on:
  workflow_dispatch:
    inputs:
      model:
        description: Operator-approved request alias
        required: true
        type: string
      response_model:
        description: Expected server-reported identity
        required: true
        type: string
      chat_url:
        description: Exact operation on the configured provider origin
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    uses: ./.github/workflows/shared-filtering.yml
    permissions:
      contents: read
      actions: read
    with:
      api_mode: systemone
      model: ${{ inputs.model }}
      response_model: ${{ inputs.response_model }}
      chat_url: ${{ inputs.chat_url }}
      durability: true
    secrets:
      HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
