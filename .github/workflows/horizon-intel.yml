name: Horizon intelligence archive
run-name: "Horizon ${{ inputs.profile_id || 'default' }} [request=${{ inputs.request_id || github.run_id }}] [hours=${{ inputs.lookback_hours || '48' }}]"
on:
  workflow_dispatch:
    inputs:
      profile_id:
        description: Approved profile ID (empty runs standard set)
        required: false
        type: string
      lookback_hours:
        description: Lookback hours (1–168)
        required: false
        default: '48'
        type: string
      request_id:
        description: Optional correlation/idempotency identifier (1–64 ASCII letters/digits/_/-)
        required: false
        type: string
permissions:
  contents: read
jobs:
  research:
    permissions:
      contents: write
    uses: ./.github/workflows/horizon-research.yml
    with:
      profile_id: ${{ inputs.profile_id }}
      lookback_hours: ${{ inputs.lookback_hours || '48' }}
      request_id: ${{ inputs.request_id }}
