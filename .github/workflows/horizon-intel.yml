name: Read-only live artifact recovery and optional draft PR reports
on:
  workflow_dispatch:
    inputs:
      publish_review_reports:
        description: Copy validated public reports only to the implementation PR
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  recover:
    uses: ./.github/workflows/live-review-recovery.yml
    permissions:
      contents: write
      actions: read
    with:
      collection_run_id: '42569950068'
      source_sha: 3c2e79d6645869f6ac3a2178d5d7194bdc73a9ab
      publish_review_reports: ${{ inputs.publish_review_reports }}
    secrets:
      HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
