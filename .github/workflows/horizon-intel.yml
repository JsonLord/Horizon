name: Real-source portfolio qualification and validated draft PR reports
on:
  workflow_dispatch:
    inputs:
      collection_run_id:
        description: Prior successful collection to recover, blank collects fresh data
        type: string
        default: ''
      source_sha:
        description: Exact prior collection source SHA when recovering
        type: string
        default: ''
      publish_review_reports:
        description: Copy validated public reports only to implementation PR
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  review:
    if: inputs.collection_run_id == ''
    uses: ./.github/workflows/live-review.yml
    permissions:
      contents: read
    secrets:
      HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
  recover:
    if: inputs.collection_run_id != ''
    uses: ./.github/workflows/live-review-recovery.yml
    permissions:
      contents: write
      actions: read
    with:
      collection_run_id: ${{ inputs.collection_run_id }}
      source_sha: ${{ inputs.source_sha }}
      publish_review_reports: ${{ inputs.publish_review_reports }}
    secrets:
      HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
