name: Explicit model and endpoint read-only qualification
on:
  workflow_dispatch:
    inputs:
      model:
        description: Exact model identifier approved by the operator
        required: true
        type: string
      chat_url:
        description: Complete POST URL on the configured provider origin
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  qualify:
    uses: ./.github/workflows/shared-filtering.yml
    permissions:
      contents: read
      actions: read
    with:
      model: ${{ inputs.model }}
      chat_url: ${{ inputs.chat_url }}
      durability: true
    secrets:
      HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
