name: Horizon intelligence archive
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      program_qualification:
        description: Read-only program qualification; never publishes
        type: boolean
        default: false
      research_ref:
        description: Approved same-repository head; must match selected workflow ref
        type: string
        default: ''
      previous_run_id:
        description: Optional prior qualification run for fresh-runner comparison
        type: string
        default: ''
      profile_id:
        description: Approved profile ID (empty runs standard set)
        required: false
        type: string
      lookback_hours:
        description: Lookback hours (1–168)
        required: false
        default: '48'
        type: string
permissions:
  contents: read
concurrency:
  group: horizon-intel-publication
  cancel-in-progress: false
jobs:
  collect:
    if: inputs.program_qualification != true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Validate inputs and run shared service
        env:
          PROFILE_ID: ${{ inputs.profile_id }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
          HORIZON_AI_MODE: 'off'
          ARCHIVE_REPO: ${{ github.repository }}
        run: |
          uv run python - <<'PY'
          import asyncio, os
          from argparse import Namespace
          from src.research.cli import run
          profile = os.environ.get('PROFILE_ID') or None
          hours = int(os.environ['LOOKBACK_HOURS'])
          if not 1 <= hours <= 168: raise ValueError('Invalid lookback')
          raise SystemExit(asyncio.run(run(Namespace(profile_id=profile, lookback_hours=hours, output='data/research', publish=False, remote='https://github.com/'+os.environ['ARCHIVE_REPO']+'.git'))))
          PY
      - uses: actions/upload-artifact@v6
        if: always() && hashFiles('data/research/intel/manifest.json') != ''
        with:
          name: research-archive
          path: data/research/intel
          retention-days: 7
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/horizon-intel.yml@refs/heads/main', github.repository)
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - uses: actions/download-artifact@v7
        with:
          name: research-archive
          path: data/research/intel
      - name: Publish using automatic job token
        env:
          ARCHIVE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PY'
          import os
          from src.research.publisher import publish
          # checkout's scoped extraheader supplies authentication, including to temporary Git repositories.
          import subprocess
          key = 'http.https://github.com/.extraheader'
          header = subprocess.check_output(['git','config','--get',key],text=True).strip()
          os.environ['GIT_CONFIG_COUNT']='1'
          os.environ['GIT_CONFIG_KEY_0']=key
          os.environ['GIT_CONFIG_VALUE_0']=header
          print(publish('data/research','https://github.com/'+os.environ['ARCHIVE_REPO']+'.git'))
          PY
  program-qualify:
    if: inputs.program_qualification == true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    concurrency:
      group: program-qualification-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - name: Qualify programs without publishing
        env:
          RESEARCH_REF: ${{ inputs.research_ref || github.ref_name }}
          PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: uv run python scripts/qualify_programs.py
      - uses: actions/upload-artifact@v6
        with:
          name: program-qualification
          path: data/program-qualification
          if-no-files-found: error
          retention-days: 14
