name: Legacy multilingual briefing (manual)
on:
  workflow_dispatch:
    inputs:
      publish_pages:
        description: Publish the legacy briefing to Pages using reviewed main code
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: legacy-briefing-${{ github.ref }}
  cancel-in-progress: false
jobs:
  summary:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - run: cp data/config.github.json data/config.json
      - name: Preserve the original multilingual briefing feature on explicit request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: uv run horizon --hours 168
      - uses: actions/upload-artifact@v6
        with:
          name: legacy-briefing
          path: docs
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: summary
    if: inputs.publish_pages == true && github.ref == 'refs/heads/main' && github.workflow_ref == format('{0}/.github/workflows/daily-summary.yml@refs/heads/main', github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: legacy-briefing
          path: public
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: public
          keep_files: true
          publish_branch: gh-pages
          enable_jekyll: true
