name: Shared filtering staging qualification
on:
  workflow_call:
    secrets:
      HORIZON_DECISION_API_KEY:
        required: false
  workflow_dispatch:
  push:
    branches: [feature/shared-intelligence-filtering]
    paths:
      - 'src/research/filtering/**'
      - 'src/research/service.py'
      - 'config/filtering/**'
      - 'profiles/examples/ai-usability.json'
      - 'scripts/shared_filtering.py'
      - 'tests/test_shared_filtering.py'
      - '.github/workflows/shared-filtering.yml'
permissions:
  contents: read
  actions: read
concurrency:
  group: shared-filtering-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen --extra dev
      - run: uv run --extra dev pytest
      - name: Exercise shared provider and all three policies
        env:
          HORIZON_DECISION_BASE_URL: ${{ vars.HORIZON_DECISION_BASE_URL }}
          HORIZON_DECISION_MODEL: ${{ vars.HORIZON_DECISION_MODEL }}
          HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
          HORIZON_DECISION_API_MODE: ${{ vars.HORIZON_DECISION_API_MODE }}
        run: uv run python -m scripts.shared_filtering
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-filtering-state
          path: data/shared-filtering
          retention-days: 14
          if-no-files-found: warn
  restore:
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --frozen
      - uses: actions/download-artifact@v7
        with:
          name: shared-filtering-state
          path: data/shared-filtering
      - name: Recover interrupted state on a fresh hosted runner
        env:
          HORIZON_DECISION_BASE_URL: ${{ vars.HORIZON_DECISION_BASE_URL }}
          HORIZON_DECISION_MODEL: ${{ vars.HORIZON_DECISION_MODEL }}
          HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
          HORIZON_DECISION_API_MODE: ${{ vars.HORIZON_DECISION_API_MODE }}
        run: uv run python -m scripts.shared_filtering --restore
      - uses: actions/upload-artifact@v6
        with:
          name: shared-filtering-restored-proof
          path: data/shared-filtering/proof.json
