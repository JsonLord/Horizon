name: Shared filtering staging qualification
on:
  workflow_call:
    inputs:
      chat_url:
        description: Optional exact endpoint on the configured provider origin for read-only qualification
        type: string
        default: ''
      durability:
        type: boolean
        default: true
    secrets:
      HORIZON_DECISION_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      chat_url:
        description: Optional exact endpoint on the configured provider origin for read-only qualification
        type: string
        default: ''
      durability:
        description: Restore the checkpoint on a separate hosted runner
        type: boolean
        default: true
permissions:
  contents: read
  actions: read
concurrency:
  group: shared-filtering-${{ github.ref }}
  cancel-in-progress: false
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      checkpoint_ready: ${{ steps.recovery.outputs.ready }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Exercise shared provider and all three policies
        env:
          HORIZON_QUALIFICATION_CHAT_URL: ${{ inputs.chat_url }}
          HORIZON_DECISION_CHAT_URL: ${{ vars.HORIZON_DECISION_CHAT_URL }}
          HORIZON_DECISION_BASE_URL: ${{ vars.HORIZON_DECISION_BASE_URL }}
          HORIZON_DECISION_MODEL: ${{ vars.HORIZON_DECISION_MODEL }}
          HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
          HORIZON_DECISION_API_MODE: ${{ vars.HORIZON_DECISION_API_MODE }}
        run: uv run python -m scripts.shared_filtering --require-live
      - id: recovery
        if: always()
        env:
          CHECKPOINT_READY: ${{ hashFiles('data/shared-filtering/manifest.json') != '' }}
        run: echo "ready=$CHECKPOINT_READY" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: shared-filtering-state
          path: data/shared-filtering
          retention-days: 14
          if-no-files-found: warn
  restore:
    if: always() && !cancelled() && inputs.durability == true && needs.qualify.outputs.checkpoint_ready == 'true'
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - uses: actions/download-artifact@v7
        with:
          name: shared-filtering-state
          path: data/shared-filtering
      - name: Recover interrupted state on a fresh hosted runner without inference
        run: uv run python -m scripts.shared_filtering --restore-only
      - uses: actions/upload-artifact@v6
        with:
          name: shared-filtering-restored-proof
          retention-days: 14
          path: data/shared-filtering/recovery-proof.json
