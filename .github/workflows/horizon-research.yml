name: Horizon reusable research
on:
  workflow_call:
    inputs:
      profile_id:
        type: string
        default: ''
      lookback_hours:
        type: string
        default: '48'
      request_id:
        type: string
        default: ''
      schedule_id:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: horizon-intel-publication
  cancel-in-progress: false
  queue: max
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      new_reports: ${{ steps.research.outputs.new_reports }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Validate inputs and run shared service
        id: research
        env:
          PROFILE_ID: ${{ inputs.profile_id }}
          LOOKBACK_HOURS: ${{ inputs.lookback_hours || '48' }}
          REQUEST_ID: ${{ inputs.request_id }}
          SCHEDULE_ID: ${{ inputs.schedule_id }}
          HORIZON_AI_MODE: 'off'
          ARCHIVE_REPO: ${{ github.repository }}
        run: uv run python -m src.control.runner
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-archive
          path: data/research/intel
          retention-days: 7
          if-no-files-found: error
  publish:
    needs: collect
    if: needs.collect.outputs.new_reports != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - uses: actions/download-artifact@v4
        with:
          name: research-archive
          path: data/research/intel
      - name: Publish using automatic job token
        env:
          ARCHIVE_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PY'
          import os
          from src.research.publisher import publish
          # checkout's scoped extraheader supplies authentication, including to temporary Git repositories.
          import subprocess
          key = 'http.https://github.com/.extraheader'
          header = subprocess.check_output(['git','config','--get',key],text=True).strip()
          os.environ['GIT_CONFIG_COUNT']='1'
          os.environ['GIT_CONFIG_KEY_0']=key
          os.environ['GIT_CONFIG_VALUE_0']=header
          print(publish('data/research','https://github.com/'+os.environ['ARCHIVE_REPO']+'.git'))
          PY
