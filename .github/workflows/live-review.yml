name: Real-source research review packs
on:
  workflow_call:
    secrets:
      HORIZON_DECISION_API_KEY:
        required: false
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: live-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Collect and review seven real-source domains without publishing
        env:
          HORIZON_AI_MODE: 'off'
          HORIZON_DECISION_BASE_URL: ${{ vars.HORIZON_DECISION_BASE_URL }}
          HORIZON_DECISION_CHAT_URL: ${{ vars.HORIZON_DECISION_CHAT_URL }}
          HORIZON_DECISION_API_MODE: ${{ vars.HORIZON_DECISION_API_MODE }}
          HORIZON_DECISION_MODEL: ${{ vars.HORIZON_DECISION_MODEL }}
          HORIZON_DECISION_RESPONSE_MODEL: ${{ vars.HORIZON_DECISION_RESPONSE_MODEL }}
          HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
        run: uv run python -m scripts.live_review --export-notices
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: live-review-seven-domains
          path: data/live-review
          retention-days: 14
          if-no-files-found: error
