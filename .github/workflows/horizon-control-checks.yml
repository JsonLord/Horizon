name: Horizon control validation
on:
  pull_request:
    paths:
      - 'src/**'
      - 'profiles/**'
      - 'sources/**'
      - 'schedules/**'
      - 'schemas/**'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'pyproject.toml'
      - 'uv.lock'
  push:
    branches: [main, feat/actions-mcp-schedules]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --extra dev
      - run: uv run python scripts/check_control.py
      - run: uv run --extra dev pytest
      - run: uv run python scripts/check_mcp.py
      - run: uv run python scripts/check_research_mcp.py
      - name: Validate workflows with checksum-verified actionlint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/actionlint
          gh release download v1.7.12 --repo rhysd/actionlint --dir /tmp/actionlint \
            --pattern actionlint_1.7.12_linux_amd64.tar.gz --pattern actionlint_1.7.12_checksums.txt
          python - <<'PY'
          import hashlib, pathlib, tarfile
          root=pathlib.Path('/tmp/actionlint')
          name='actionlint_1.7.12_linux_amd64.tar.gz'
          expected=next(line.split()[0] for line in (root/'actionlint_1.7.12_checksums.txt').read_text().splitlines() if line.split()[-1]==name)
          assert hashlib.sha256((root/name).read_bytes()).hexdigest()==expected
          with tarfile.open(root/name) as archive:
              archive.extract('actionlint',root,filter='data')
          PY
          uv run python scripts/check_workflows.py --actionlint /tmp/actionlint/actionlint
