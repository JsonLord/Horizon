name: Held-out two-stage filtering experiment

on:
  push:
    branches:
      - experiment/two-stage-heldout-2026-11-10

permissions:
  contents: read

concurrency:
  group: two-stage-heldout-2026-11-10-${{ github.ref }}
  cancel-in-progress: false

jobs:
  experiment:
    if: github.ref == 'refs/heads/experiment/two-stage-heldout-2026-11-10'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen --extra dev
      - name: Run bounded held-out experiment
        env:
          HORIZON_AI_MODE: 'off'
          HORIZON_DECISION_BASE_URL: ${{ vars.HORIZON_DECISION_BASE_URL }}
          HORIZON_DECISION_CHAT_URL: ${{ vars.HORIZON_DECISION_CHAT_URL }}
          HORIZON_DECISION_API_MODE: ${{ vars.HORIZON_DECISION_API_MODE }}
          HORIZON_DECISION_MODEL: ${{ vars.HORIZON_DECISION_MODEL }}
          HORIZON_DECISION_RESPONSE_MODEL: ${{ vars.HORIZON_DECISION_RESPONSE_MODEL }}
          HORIZON_DECISION_API_KEY: ${{ secrets.HORIZON_DECISION_API_KEY }}
        run: uv run python -m scripts.two_stage_experiment --run-id "${GITHUB_RUN_ID}"
      - name: Upload experiment evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: two-stage-heldout-${{ github.run_id }}
          path: data/two-stage-experiment/${{ github.run_id }}
          retention-days: 30
          if-no-files-found: error
